<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Full Site Security Auditor, report</title>
  <link rel="stylesheet" href="report.css" />
</head>
<body>
  <div id="sidebar">
    <div id="sb-header">
      <img src="icons/icon48.png" alt="" />
      <div>
        <div id="sb-title">Full site security auditor</div>
        <div id="sb-subtitle">CMS &amp; Framework Edition</div>
      </div>
    </div>
    <div id="sb-site-line">
      <span class="dot dot-accent" id="sb-status-dot"></span>
      <span id="sb-site-text">loading…</span>
    </div>

    <div id="sb-score">
      <div id="sb-ring"><div id="sb-ring-inner"><div id="sb-ring-num">0</div><div id="sb-ring-den">/ 0</div></div></div>
      <div>
        <div id="sb-score-site"></div>
        <div id="sb-score-detail"></div>
      </div>
    </div>

    <div id="sb-progress-block" hidden>
      <div class="bar"><div id="sb-bar-fill" class="bar-fill"></div></div>
      <div id="sb-progress-text"></div>
    </div>

    <div id="sb-categories"></div>

    <div id="sb-actions">
      <button id="btn-rescan">rescan</button>
      <button id="btn-export-all" class="light-green">export all (.xlsx)</button>
      <button id="btn-export-pdf" class="accent-outline">export PDF report</button>
    </div>
  </div>

  <div id="main">
    <div id="empty-state" hidden>
      <p class="muted">No scan found for this site yet. Start one from the extension popup, then reopen this report.</p>
    </div>
    <div id="panels"></div>
  </div>

  <script src="report.js"></script>
</body>
</html>
